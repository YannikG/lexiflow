[project]
name = "sqlite-vec"
version = "0.1.9"
description = "Vendored sqlite-vec loadable extension for LexiFlow packaging"
requires-python = ">=3.12,<3.14"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sqlite_vec"]
only-include = ["sqlite_vec"]
