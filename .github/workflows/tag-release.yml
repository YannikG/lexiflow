name: tag-release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to tag (X.Y.Z, without v prefix)
        required: true
        type: string
  pull_request:
    types:
      - closed
    branches:
      - main

permissions:
  contents: write
  actions: write

jobs:
  tag-from-release-pr:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.merged == true &&
      (
        startsWith(github.event.pull_request.head.ref, 'release/') ||
        startsWith(github.event.pull_request.title, 'chore: release v')
      )
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: false

      - name: Read version from merged commit
        id: version
        run: |
          VERSION="$(uv run python packaging/scripts/sync_version.py --resolve-only)"
          echo "value=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Tagging v${VERSION}"

      - name: Create and push release tag
        id: tag
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          TAG="v${VERSION}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin --tags
          if git ls-remote --exit-code origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "${TAG} already exists on origin; skipping push."
            exit 0
          fi
          git tag "${TAG}"
          git push origin "${TAG}"

      - name: Trigger release build
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          # Tags pushed with GITHUB_TOKEN do not fire other workflows (push: tags).
          # workflow_dispatch is exempt; start release.yml explicitly.
          gh workflow run release.yml --ref "${TAG}" -f publish_release=true

  tag-manual:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Create and push release tag
        id: tag
        run: |
          VERSION="${{ github.event.inputs.version }}"
          TAG="v${VERSION}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin --tags
          if git ls-remote --exit-code origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "${TAG} already exists on origin; skipping push."
            exit 0
          fi
          git tag "${TAG}"
          git push origin "${TAG}"

      - name: Trigger release build
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: gh workflow run release.yml --ref "${TAG}" -f publish_release=true
