name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish_release:
        description: Create GitHub Release from built artifacts (tag-release automation only)
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    name: build-${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            runner: ubuntu-latest
            fetch_platform: linux
            artifact_glob: dist/LexiFlow-*.AppImage
            installer_arch: ""
          - platform: macos-arm64
            runner: macos-latest
            fetch_platform: macos-arm64
            artifact_glob: dist/LexiFlow-*.dmg
            installer_arch: ""
          - platform: windows
            runner: windows-latest
            fetch_platform: windows
            artifact_glob: dist/LexiFlow-*.msi
            installer_arch: ""
          # windows-arm64: disabled until sqlite-vec MSVC build is reliable in CI (#40).
    uses: ./.github/workflows/release-artifacts.yml
    with:
      platform: ${{ matrix.platform }}
      runner: ${{ matrix.runner }}
      fetch_platform: ${{ matrix.fetch_platform }}
      artifact_glob: ${{ matrix.artifact_glob }}
      installer_arch: ${{ matrix.installer_arch }}

  publish:
    needs: build
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' && inputs.publish_release)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Merge checksums
        run: |
          mkdir -p merged
          find release-artifacts -maxdepth 2 -type f ! -name 'checksums.txt' -exec cp {} merged/ \;
          (cd merged && sha256sum *) > merged/checksums.txt
          ls -la merged/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: merged/*
          generate_release_notes: true
