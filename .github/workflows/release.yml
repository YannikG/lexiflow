name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish_release:
        description: Create GitHub Release from built artifacts (tag-release automation only)
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    uses: ./.github/workflows/release-artifacts.yml

  publish:
    needs: build
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' && inputs.publish_release)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Merge checksums
        run: |
          mkdir -p merged
          find release-artifacts -maxdepth 2 -type f ! -name 'checksums.txt' -exec cp {} merged/ \;
          (cd merged && sha256sum *) > merged/checksums.txt
          ls -la merged/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: merged/*
          generate_release_notes: true
