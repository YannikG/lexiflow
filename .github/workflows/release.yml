name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build-${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            runner: ubuntu-latest
            fetch_platform: linux
            artifact_glob: dist/LexiFlow-*.AppImage
          - platform: macos-arm64
            runner: macos-latest
            fetch_platform: macos-arm64
            artifact_glob: dist/LexiFlow-*.dmg
          - platform: windows
            runner: windows-latest
            fetch_platform: windows
            artifact_glob: dist/LexiFlow-*.msi
            installer_arch: ""
          # windows-arm64: disabled until sqlite-vec MSVC build is reliable in CI (#40).

    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 \
            libgl1 \
            libglib2.0-0 \
            libxkbcommon0 \
            libxcb-cursor0 \
            libxcb-xinerama0 \
            libdbus-1-3 \
            xvfb \
            fuse \
            libfuse2
          wget -O /tmp/appimagetool "https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage"
          chmod +x /tmp/appimagetool
          sudo mv /tmp/appimagetool /usr/local/bin/appimagetool

      - name: Install macOS build dependencies
        if: runner.os == 'macOS'
        run: brew install create-dmg || true

      - name: Install Windows build dependencies
        if: runner.os == 'Windows'
        run: choco install wixtoolset -y

      - name: Fetch sqlite-vec loadable
        shell: bash
        run: python packaging/scripts/fetch_sqlite_vec.py --platform "${{ matrix.fetch_platform }}"

      - name: Install release dependencies
        run: uv sync --frozen --group release

      - name: Sync version from tag
        shell: bash
        env:
          LF_SYNC_CI_DEV: "1"
        run: |
          VERSION="$(uv run python packaging/scripts/sync_version.py)"
          echo "LF_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "LF_EXPECTED_VERSION=$VERSION" >> "$GITHUB_ENV"
          WIX_VERSION="$(uv run python packaging/scripts/wix_version.py "$VERSION")"
          echo "WIX_VERSION=$WIX_VERSION" >> "$GITHUB_ENV"

      - name: Fetch llama-server
        shell: bash
        run: |
          uv run python packaging/scripts/generate_icons.py
          uv run python packaging/scripts/fetch_llama_server.py --platform "${{ matrix.fetch_platform }}"

      - name: Build PyInstaller bundle
        run: uv run pyinstaller packaging/lexiflow.spec --noconfirm

      - name: Smoke test bundle
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          if [[ "${{ runner.os }}" == "Linux" ]]; then
            xvfb-run -a bash packaging/scripts/smoke_bundle.sh
          elif [[ "${{ runner.os }}" == "macOS" ]]; then
            export LF_SKIP_UI_SMOKE=1
            bash packaging/scripts/smoke_bundle.sh
          else
            export LF_SKIP_UI_SMOKE=1
            bash packaging/scripts/smoke_bundle.sh
          fi

      - name: Build Linux AppImage
        if: matrix.platform == 'linux'
        run: bash packaging/scripts/build_appimage.sh

      - name: Build macOS DMG
        if: matrix.platform == 'macos-arm64'
        run: bash packaging/scripts/build_dmg.sh

      - name: Build Windows MSI
        if: matrix.platform == 'windows'
        shell: pwsh
        env:
          LF_INSTALLER_ARCH: ${{ matrix.installer_arch }}
        run: |
          $env:LEXIFLOW_BUNDLE_DIR = Join-Path $PWD "dist\LexiFlow"
          ./packaging/scripts/build_msi.ps1

      - name: Collect release artifacts
        shell: bash
        run: |
          mkdir -p release-artifacts
          shopt -s nullglob
          for path in ${{ matrix.artifact_glob }}; do
            cp "$path" release-artifacts/
          done
          if [[ ! "$(ls -A release-artifacts)" ]]; then
            echo "no release artifacts found for ${{ matrix.platform }}" >&2
            exit 1
          fi
          (cd release-artifacts && sha256sum *) > release-artifacts/checksums.txt

      - name: Upload platform artifact
        uses: actions/upload-artifact@v4
        with:
          name: lexiflow-${{ matrix.platform }}
          path: release-artifacts/

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Merge checksums
        run: |
          mkdir -p merged
          find release-artifacts -maxdepth 2 -type f ! -name 'checksums.txt' -exec cp {} merged/ \;
          (cd merged && sha256sum *) > merged/checksums.txt
          ls -la merged/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: merged/*
          generate_release_notes: true
