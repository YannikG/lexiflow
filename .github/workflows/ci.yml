# Phase 01: real quality gates (replaces Phase 00 placeholders)

name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install dependencies
        run: uv sync --frozen
      - name: Ruff check
        run: uv run ruff check .
      - name: Ruff format
        run: uv run ruff format --check .

  mypy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install dependencies
        run: uv sync --frozen
      - name: Mypy (lexiflow-core)
        run: uv run mypy packages/lexiflow-core

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install Qt runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 \
            libgl1 \
            libglib2.0-0 \
            libxkbcommon0 \
            libxcb-cursor0 \
            libxcb-xinerama0 \
            libdbus-1-3 \
            xvfb
      - name: Install dependencies
        run: uv sync --frozen
      - name: Pytest with per-package coverage floors
        env:
          QT_QPA_PLATFORM: offscreen
        run: xvfb-run -a uv run pytest

  build-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install Qt runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 \
            libgl1 \
            libglib2.0-0 \
            libxkbcommon0 \
            libxcb-cursor0 \
            libxcb-xinerama0 \
            libdbus-1-3 \
            xvfb
      - name: Install release dependencies
        run: uv sync --frozen --group release
      - name: Sync version and fetch llama-server
        run: |
          VERSION="$(uv run python packaging/scripts/sync_version.py)"
          echo "LF_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "LF_EXPECTED_VERSION=$VERSION" >> "$GITHUB_ENV"
          uv run python packaging/scripts/generate_icons.py
          uv run python packaging/scripts/fetch_llama_server.py --platform linux
      - name: Build PyInstaller bundle
        run: uv run pyinstaller packaging/lexiflow.spec --noconfirm
      - name: Smoke test bundle
        env:
          QT_QPA_PLATFORM: offscreen
        run: xvfb-run -a bash packaging/scripts/smoke_bundle.sh
      - name: Upload Linux bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: lexiflow-linux-bundle
          path: dist/LexiFlow/
          retention-days: 7
