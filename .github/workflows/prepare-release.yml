name: prepare-release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Semver bump applied to max(latest tag, pyproject.toml)
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-bump-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Decide whether to run
        id: gate
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "bump=${{ inputs.bump }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          MSG="${{ github.event.head_commit.message }}"
          if [[ "$MSG" =~ ^chore:\ release\ v ]] \
            || [[ "$MSG" =~ ^Merge\ pull\ request.*release/ ]]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if uv run python packaging/scripts/bump_version.py --check-auto; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "bump=patch" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip when not needed
        if: steps.gate.outputs.run != 'true'
        run: echo "No release bump PR needed."

      - name: Skip when release PR already open
        if: steps.gate.outputs.run == 'true'
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          COUNT="$(gh pr list --base main --state open --json headRefName \
            --jq '[.[] | select(.headRefName | startswith("release/"))] | length')"
          if [[ "$COUNT" != "0" ]]; then
            echo "open=true" >> "$GITHUB_OUTPUT"
            echo "An open release/* PR already exists; skipping."
          else
            echo "open=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Compute next version
        if: steps.gate.outputs.run == 'true' && steps.existing.outputs.open != 'true'
        id: version
        run: |
          VERSION="$(uv run python packaging/scripts/bump_version.py --bump "${{ steps.gate.outputs.bump }}")"
          echo "value=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Next release version: ${VERSION}"

      - name: Create release bump PR
        if: steps.gate.outputs.run == 'true' && steps.existing.outputs.open != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.version.outputs.value }}"
          BRANCH="release/v${VERSION}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          uv run python packaging/scripts/bump_version.py --bump "${{ steps.gate.outputs.bump }}" --write
          git add pyproject.toml packages/lexiflow-core/src/lexiflow_core/__init__.py
          git checkout -b "${BRANCH}"
          git commit -m "chore: release v${VERSION}"
          git push origin "${BRANCH}"
          gh pr create \
            --base main \
            --head "${BRANCH}" \
            --title "chore: release v${VERSION}" \
            --body "$(cat <<EOF
## Release v${VERSION}

Automated version bump (${{ steps.gate.outputs.bump }}).

**Merge this PR to tag \`v${VERSION}\` and start the release build** (\`.github/workflows/release.yml\`).

No manual tag or push to \`main\` is required.
EOF
)"
