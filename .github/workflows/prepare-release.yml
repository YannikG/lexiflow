name: prepare-release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Semver bump applied to max(latest tag, pyproject.toml)
        type: choice
        options:
          - patch
          - minor
          - major
        default: "patch"
  push:
    branches:
      - main

concurrency:
  group: prepare-release
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  release-bump-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Decide whether to run
        id: gate
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "bump=${{ github.event.inputs.bump }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          MSG="${{ github.event.head_commit.message }}"
          if [[ "$MSG" =~ ^chore:\ release\ v ]] \
            || [[ "$MSG" =~ ^Merge\ pull\ request.*release/ ]] \
            || [[ "$MSG" == *release/v* ]]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if uv run python packaging/scripts/bump_version.py --check-auto; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "bump=patch" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip when not needed
        if: steps.gate.outputs.run != 'true'
        run: echo "No release bump PR needed."

      - name: Skip when release PR already open
        if: steps.gate.outputs.run == 'true'
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          COUNT="$(gh pr list --base main --state open --json headRefName \
            --jq '[.[] | select(.headRefName | startswith("release/"))] | length')"
          if [[ "$COUNT" != "0" ]]; then
            echo "open=true" >> "$GITHUB_OUTPUT"
            echo "An open release/* PR already exists; skipping."
          else
            echo "open=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create release bump PR
        if: steps.gate.outputs.run == 'true' && steps.existing.outputs.open != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BUMP="${{ steps.gate.outputs.bump }}"
          VERSION="$(uv run python packaging/scripts/bump_version.py --bump "${BUMP}" --write)"
          BRANCH="release/v${VERSION}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml packages/lexiflow-core/src/lexiflow_core/__init__.py
          git checkout -b "${BRANCH}"
          git commit -m "chore: release v${VERSION}"
          git push -u origin "${BRANCH}"
          BODY_FILE="$(mktemp)"
          {
            echo "## Release v${VERSION}"
            echo ""
            echo "Automated version bump (${BUMP})."
            echo ""
            echo "**Merge this PR to tag \`${VERSION}\` and start the release build** (\`.github/workflows/release.yml\`)."
            echo ""
            echo "No manual tag or push to \`main\` is required."
          } > "${BODY_FILE}"
          gh pr create \
            --base main \
            --head "${BRANCH}" \
            --title "chore: release v${VERSION}" \
            --body-file "${BODY_FILE}"
