name: release-build

# Manual full release build (installers + bundle smoke) without creating a GitHub Release.
# Use this to validate packaging on a PR branch before merge or tag.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag, or commit SHA to build (e.g. feature/my-branch)
        required: true
        type: string
        default: main
      platform:
        description: Platform(s) to build
        type: choice
        options:
          - all
          - linux
          - macos-arm64
          - windows
        default: all

permissions:
  contents: read

concurrency:
  group: release-build-${{ github.workflow }}-${{ inputs.ref }}-${{ inputs.platform }}
  cancel-in-progress: true

jobs:
  build:
    name: build-${{ matrix.platform }}
    if: inputs.platform == 'all' || inputs.platform == matrix.platform
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            runner: ubuntu-latest
            fetch_platform: linux
            artifact_glob: dist/LexiFlow-*.AppImage
            installer_arch: ""
          - platform: macos-arm64
            runner: macos-latest
            fetch_platform: macos-arm64
            artifact_glob: dist/LexiFlow-*.dmg
            installer_arch: ""
          - platform: windows
            runner: windows-latest
            fetch_platform: windows
            artifact_glob: dist/LexiFlow-*.msi
            installer_arch: ""
          # windows-arm64: disabled until sqlite-vec MSVC build is reliable in CI (#40).
    uses: ./.github/workflows/release-artifacts.yml
    with:
      ref: ${{ inputs.ref }}
      platform: ${{ matrix.platform }}
      runner: ${{ matrix.runner }}
      fetch_platform: ${{ matrix.fetch_platform }}
      artifact_glob: ${{ matrix.artifact_glob }}
      installer_arch: ${{ matrix.installer_arch }}
